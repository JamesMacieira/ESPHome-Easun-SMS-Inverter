sensor:

###############################################################################
# Status / Faults / Alarms
###############################################################################

  - platform: modbus_controller
    modbus_controller_id: sms_0
    id: ${name}_software_version
    name: "${name} Software Version"
    address: 0x0040
    register_type: holding
    value_type: U_WORD
    entity_category: diagnostic

  - platform: modbus_controller
    modbus_controller_id: sms_0
    id: ${name}_bms_connection_status
    name: "${name} BMS Connection Status"
    address: 0x0041
    register_type: holding
    value_type: U_WORD
    entity_category: diagnostic

  - platform: modbus_controller
    modbus_controller_id: sms_0
    id: ${name}_state_machine_state
    name: "${name} State Machine State"
    address: 0x0042
    register_type: holding
    value_type: U_WORD

  - platform: modbus_controller
    modbus_controller_id: sms_0
    id: ${name}_energy_terminal_status
    name: "${name} Energy Terminal Status"
    address: 0x0043
    register_type: holding
    value_type: U_WORD

  - platform: modbus_controller
    modbus_controller_id: sms_0
    id: ${name}_energy_flow_state
    name: "${name} Energy Flow State"
    address: 0x0044
    register_type: holding
    value_type: U_WORD

  - platform: modbus_controller
    modbus_controller_id: sms_0
