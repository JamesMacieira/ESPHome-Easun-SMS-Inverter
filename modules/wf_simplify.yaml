# Fault / Alarm Binary Sensors
###############################################################################

binary_sensor:

#
# Fault Code 1 (0x0046)
#

  - platform: template
    name: "${name} Mains Soft Start Failure"
    device_class: problem
    lambda: 'return ((uint16_t)id(${name}_fault_code_1).state & (1 << 0));'

  - platform: template
    name: "${name} Bus Overvoltage"
