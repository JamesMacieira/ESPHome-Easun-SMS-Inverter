  - platform: modbus_controller
    modbus_controller_id: sms_0
    id: ${name}_simplify_pv1_voltage
    name: "${name} Simplified PV1 Voltage"
    address: 0x0096
    register_type: holding
    value_type: S_WORD
    unit_of_measurement: "V"
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 1
    filters:
      - multiply: 0.1

  - platform: modbus_controller
    modbus_controller_id: sms_0
    id: ${name}_simplify_pv1_current
    name: "${name} Simplified PV1 Current"
    address: 0x0097
    register_type: holding
    value_type: S_WORD
    unit_of_measurement: "A"
    device_class: current
    state_class: measurement
    accuracy_decimals: 2
    filters:
      - multiply: 0.01

  - platform: modbus_controller
    modbus_controller_id: sms_0
    id: ${name}_simplify_pv1_power
    name: "${name} Simplified PV1 Power"
    address: 0x0098
    register_type: holding
    value_type: S_WORD
    unit_of_measurement: "W"
    device_class: power
    state_class: measurement

  - platform: modbus_controller
    modbus_controller_id: sms_0
    id: ${name}_simplify_pv2_voltage
    name: "${name} Simplified PV2 Voltage"
    address: 0x0099
    register_type: holding
    value_type: S_WORD
    unit_of_measurement: "V"
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 1
    filters:
      - multiply: 0.1

  - platform: modbus_controller
    modbus_controller_id: sms_0
    id: ${name}_simplify_pv2_current
    name: "${name} Simplified PV2 Current"
    address: 0x009A
    register_type: holding
    value_type: S_WORD
    unit_of_measurement: "A"
    device_class: current
    state_class: measurement
    accuracy_decimals: 2
    filters:
      - multiply: 0.01

  - platform: modbus_controller
    modbus_controller_id: sms_0
    id: ${name}_simplify_pv2_power
    name: "${name} Simplified PV2 Power"
    address: 0x009B
    register_type: holding
    value_type: S_WORD
    unit_of_measurement: "W"
    device_class: power
    state_class: measurement

  - platform: modbus_controller
    modbus_controller_id: sms_0
    id: ${name}_pv_energy_today
    name: "${name} PV Energy Today"
    address: 0x009C
    register_type: holding
    value_type: U_WORD
    unit_of_measurement: "100Wh"

  - platform: modbus_controller
    modbus_controller_id: sms_0
    id: ${name}_pv_energy_total
    name: "${name} PV Energy Total"
    address: 0x009D
    register_type: holding
    value_type: U_WORD
    unit_of_measurement: "100Wh"

