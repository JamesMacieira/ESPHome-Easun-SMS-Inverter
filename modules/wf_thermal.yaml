###############################################################################
# WF_THERMAL
###############################################################################

binary_sensor:

  - platform: template
    id: ${name}_fan_fault
    name: "${name} Fan Fault"
    device_class: problem
    lambda: |-
      return id(${name}_fan_status_raw).state != 0;

sensor:

###############################################################################
# Fan
###############################################################################

  - platform: modbus_controller
    modbus_controller_id: sms_0
    id: ${name}_fan_speed
    name: "${name} Fan Speed"
    address: 0x0320
    register_type: holding
    value_type: U_WORD
    unit_of_measurement: "%"
    state_class: measurement

  - platform: modbus_controller
    modbus_controller_id: sms_0
    id: ${name}_fan_status_raw
    internal: true
    address: 0x0321
    register_type: holding
    value_type: U_WORD

###############################################################################
# Temperatures
###############################################################################

  - platform: modbus_controller
    modbus_controller_id: sms_0
    id: ${name}_pv_temperature
    name: "${name} PV Temperature"
    address: 0x0330
    register_type: holding
    value_type: S_WORD
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement

  - platform: modbus_controller
    modbus_controller_id: sms_0
    id: ${name}_inverter_temperature
    name: "${name} Inverter Temperature"
    address: 0x0331
    register_type: holding
    value_type: S_WORD
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement

  - platform: modbus_controller
    modbus_controller_id: sms_0
    id: ${name}_charger_temperature
    name: "${name} Charger Temperature"
    address: 0x0332
    register_type: holding
    value_type: S_WORD
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement

  - platform: modbus_controller
    modbus_controller_id: sms_0
    id: ${name}_charger2_temperature
    name: "${name} Charger 2 Temperature"
    address: 0x0333
    register_type: holding
    value_type: S_WORD
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement

  - platform: modbus_controller
    modbus_controller_id: sms_0
    id: ${name}_ambient_temperature
    name: "${name} Ambient Temperature"
    address: 0x0334
    register_type: holding
    value_type: S_WORD
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement

  - platform: modbus_controller
    modbus_controller_id: sms_0
    id: ${name}_discharge_temperature
    name: "${name} Discharge Temperature"
    address: 0x0335
    register_type: holding
    value_type: S_WORD
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    