###############################################################################
# WF_INV
###############################################################################

sensor:

#
# Inverter Settings
#

  - platform: modbus_controller
    modbus_controller_id: sms_0
    id: ${name}_inverter_voltage_setpoint
    name: "${name} Inverter Voltage Setpoint"
    address: 0x02A0
    register_type: holding
    value_type: S_WORD
    unit_of_measurement: V
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 1
    filters:
      - multiply: 0.1

  - platform: modbus_controller
    modbus_controller_id: sms_0
    id: ${name}_inverter_frequency_setpoint
    name: "${name} Inverter Frequency Setpoint"
    address: 0x02A1
    register_type: holding
    value_type: S_WORD
    unit_of_measurement: Hz
    device_class: frequency
    state_class: measurement
    accuracy_decimals: 2
    filters:
      - multiply: 0.01

###############################################################################
# Phase A
###############################################################################

  - platform: modbus_controller
    modbus_controller_id: sms_0
    id: ${name}_phase_a_inverter_voltage
    name: "${name} Phase A Inverter Voltage"
    address: 0x02AA
    register_type: holding
    value_type: S_WORD
    unit_of_measurement: V
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 1
    filters: [{multiply: 0.1}]

  - platform: modbus_controller
    modbus_controller_id: sms_0
    id: ${name}_phase_a_inverter_frequency
    name: "${name} Phase A Inverter Frequency"
    address: 0x02AB
