    name: "${name} Phase A Inverter Current"
    address: 0x02AC
    register_type: holding
    value_type: S_WORD
    unit_of_measurement: A
    device_class: current
    state_class: measurement
    accuracy_decimals: 2
    filters: [{multiply: 0.01}]

  - platform: modbus_controller
    modbus_controller_id: sms_0
    id: ${name}_phase_a_dc_component
    name: "${name} Phase A DC Component"
    address: 0x02AD
    register_type: holding
    value_type: S_WORD
    unit_of_measurement: mV
    state_class: measurement

  - platform: modbus_controller
    modbus_controller_id: sms_0
    id: ${name}_phase_a_daily_input_energy
    name: "${name} Phase A Daily Input Energy"
    address: 0x02AE
    register_count: 2
    register_type: holding
    value_type: U_DWORD
    unit_of_measurement: kWh
    device_class: energy
    state_class: total_increasing
    filters: [{multiply: 0.01}]

  - platform: modbus_controller
