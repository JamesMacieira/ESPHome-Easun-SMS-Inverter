# Core transport for the Easun SMS / CVTE inverter family.
# Include this package and the telemetry package from your device configuration.
substitutions:
  easun_modbus_address: "0x01"
  easun_update_interval: 5s

uart:
  id: easun_uart
  tx_pin: ${tx_pin}
  rx_pin: ${rx_pin}
  baud_rate: 9600
  data_bits: 8
  parity: NONE
  stop_bits: 1

modbus:
  id: easun_modbus
  uart_id: easun_uart
  send_wait_time: 250ms

modbus_controller:
  - id: easun_sms
    address: ${easun_modbus_address}
    modbus_id: easun_modbus
    command_throttle: 50ms
    update_interval: ${easun_update_interval}
