# This is an example configuration file for the Easun 6.5KP inverter using the ESPHome framework.
# It is designed to be used with the easun_sms_lite.yaml package, which provides safe, 
#read-only telemetry modules and simple congiguration for the Easun SMS CVTE protocol.
# the all packages contein 60 sensors, and was optimided for single inverter use with 
# essencial telemetry and configuration.

substitutions:
  name: easun_65kp
  friendly_name: Easun 6.5KP
  device_description: "Monitor a Easun iSolar SMS 6.5KW inverter via USB-A RS232 port"
  tx_pin: GPIO16
  rx_pin: GPIO17

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  comment: ${device_description}
  min_version: 2024.6.0
  
  project:
    name: "jamesmacieira.easun_sms"
    version: 0.1.2
  
  on_boot:
    priority: -100
    then:
      - logger.log: "Sending inverter wakeup"
      - uart.write:
          id: uart_0
          data: [0x01, 0xAA, 0x06, 0xDE, 0xA2]
      - delay: 300ms

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf

# Enable logging
logger:
  level: DEBUG
  baud_rate: 0

# Enable Home Assistant API
api:
  encryption:
    key: "xxxxxxxxx"

ota:
  - platform: esphome
    password: "xxxxxxxxxxxxxx"

wifi:
  ssid: xxxxxxx
  password: xxxxxxx

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "Easun-65Kp Fallback Hotspot"
    password: "xxxxxxxxxx"

web_server:
  port: 80

uart:
  id: uart_0
  tx_pin: ${tx_pin}
  rx_pin: ${rx_pin}
  baud_rate: 9600
  data_bits: 8
  parity: NONE
  stop_bits: 1

modbus:
  id: modbus_0
  uart_id: uart_0
  send_wait_time: 250ms

modbus_controller:
  - id: sms_0
    address: 0x01
    modbus_id: modbus_0
    setup_priority: -10
    update_interval: 2s
    command_throttle: 500ms
    

packages:
  easun_sms: github://JamesMacieira/ESPHome-Easun-SMS-Inverter/easun_sms_lite.yaml@main
