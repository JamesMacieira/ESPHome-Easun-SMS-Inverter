###############################################################################
# WF_WorkMode
###############################################################################

text_sensor:


###############################################################################
# Charging Priority
###############################################################################

  - platform: template
    id: charging_priority
    name: "Charging Priority"
    lambda: |-
      switch ((uint16_t)id(charging_priority_raw).state) {
        case 0: return {"PNG"};
        case 1: return {"OPV"};
        case 2: return {"PVF"};
        default: return {"Unknown"};
      }

###############################################################################
# State Machine
###############################################################################

  - platform: template
    id: operating_state
    name: "Operating State"
    lambda: |-
      switch ((uint16_t)id(state_machine_raw).state) {
        case 0: return {"Power On"};
        case 1: return {"Initialization"};
        case 2: return {"Standby"};
        case 3: return {"AC Mode"};
        case 4: return {"Solar Mode"};
        case 5: return {"Battery Mode"};
        case 6: return {"Generator Mode"};
        case 7: return {"Fault"};
        case 8: return {"Power Off"};
        case 9: return {"Factory"};
        case 10: return {"Upgrade"};
        default: return {"Unknown"};
      }

sensor:

  

 

  - platform: modbus_controller
    modbus_controller_id: sms_0
    id: charging_priority_raw
    internal: true
    address: 0x0143
    register_type: holding
    value_type: U_WORD

  - platform: modbus_controller
    modbus_controller_id: sms_0
    id: state_machine_raw
    internal: true
    address: 0x0144
    register_type: holding
    value_type: U_WORD
  
