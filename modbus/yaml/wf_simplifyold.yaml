###############################################################################
# WF_Simplify
# Faults / Alarms
###############################################################################

sensor:
  - platform: modbus_controller
    modbus_controller_id: sms_0
    id: fault_code_1
    name: "Fault Code 1"
    address: 0x0046
    register_type: holding
    value_type: U_WORD
    entity_category: diagnostic

  - platform: modbus_controller
    modbus_controller_id: sms_0
    id: fault_code_2
    name: "Fault Code 2"
    address: 0x0047
    register_type: holding
    value_type: U_WORD
    entity_category: diagnostic

  - platform: modbus_controller
    modbus_controller_id: sms_0
    id: alarm_code_1
    name: "Alarm code 1"
    address: 0x0048
    register_type: holding
    value_type: U_WORD
    entity_category: diagnostic

  - platform: modbus_controller
    modbus_controller_id: sms_0
    id: alarm_code_2
    name: "Alarm code 2"
    address: 0x0049
    register_type: holding
    value_type: U_WORD
    entity_category: diagnostic

binary_sensor:
  - platform: template
    name: "Mains soft start failure"
    device_class: problem
    lambda: |-
      return ((uint16_t) id(fault_code_1).state & (1 << 0));

  - platform: template
    name: "Overtemperature"
    device_class: problem
    lambda: |-
      return ((uint16_t) id(fault_code_1).state & (1 << 4));

  - platform: template
    name: "Inverter soft start failure"
    device_class: problem
    lambda: |-
      return ((uint16_t) id(fault_code_1).state & (1 << 8));

  - platform: template
    name: "Inverter overvoltage"
    device_class: problem
    lambda: |-
      return ((uint16_t) id(fault_code_1).state & (1 << 9));

  - platform: template
    name: "Inverter undervoltage"
    device_class: problem
    lambda: |-
      return ((uint16_t) id(fault_code_1).state & (1 << 10));

  - platform: template
    name: "Inverter short circuit"
