    lambda: |-
      return ((uint16_t) id(fault_code_1).state & (1 << 14));

  - platform: template
    name: "No bootloader"
    device_class: problem
    lambda: |-
      return ((uint16_t) id(fault_code_1).state & (1 << 15));

  - platform: template
    name: "Programming in progress"
    device_class: problem
    lambda: |-
      return ((uint16_t) id(fault_code_2).state & (1 << 0));

  - platform: template
    name: "Photovoltaic reverse connection"
