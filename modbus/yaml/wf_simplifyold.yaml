###############################################################################
# Battery
###############################################################################

  - platform: modbus_controller
    modbus_controller_id: sms_0
    id: battery_positive_voltage
    name: "Battery Positive Voltage"
    address: 0x0080
    register_type: holding
    value_type: S_WORD
    unit_of_measurement: V
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 1
    filters:
      - multiply: 0.1

  - platform: modbus_controller
    modbus_controller_id: sms_0
    id: battery_positive_current
    name: "Battery Positive Current"
    address: 0x0081
    register_type: holding
    value_type: S_WORD
    unit_of_measurement: A
    device_class: current
    state_class: measurement
    accuracy_decimals: 1
    filters:
      - multiply: 0.1

  - platform: modbus_controller
    modbus_controller_id: sms_0
    id: battery_negative_voltage
    name: "Battery Negative Voltage"
    address: 0x0082
    register_type: holding
    value_type: S_WORD
    unit_of_measurement: V
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 1
    filters:
      - multiply: 0.1

  - platform: modbus_controller
    modbus_controller_id: sms_0
    id: battery_negative_current
    name: "Battery Negative Current"
    address: 0x0083
    register_type: holding
    value_type: S_WORD
    unit_of_measurement: A
    device_class: current
    state_class: measurement
    accuracy_decimals: 1
    filters:
      - multiply: 0.1

  - platform: modbus_controller
    modbus_controller_id: sms_0
    id: battery_capacity
    name: "Battery Capacity"
    address: 0x0084
    register_type: holding
    value_type: S_WORD
    unit_of_measurement: "%"
    device_class: battery
    state_class: measurement
    accuracy_decimals: 1
    filters:
      - multiply: 0.1

  - platform: modbus_controller
    modbus_controller_id: sms_0
    id: battery_power
    name: "Battery Power"
    address: 0x0085
    register_type: holding
    value_type: S_WORD
    unit_of_measurement: W
    device_class: power
    state_class: measurement

