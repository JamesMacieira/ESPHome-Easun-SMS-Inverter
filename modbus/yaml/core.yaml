substitutions:
  name: easun-65kp
  friendly_name: Easun 6.5KP
  device_description: "Easun iSolar SMS 6.5KP Modbus"

  tx_pin: GPIO16
  rx_pin: GPIO17

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  comment: ${device_description}

  min_version: 2024.6.0

  project:
    name: easun.sms65kp
    version: "1.0.0"

  on_boot:
    priority: -100
    then:
      - logger.log: "Sending inverter wakeup"
      - uart.write:
          id: uart_0
          data: [0x01,0xAA,0x06,0xDE,0xA2]
      - delay: 300ms

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf

logger:
  baud_rate: 0
  level: DEBUG

api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  ap:
    ssid: "${friendly_name} Fallback"
    password: !secret fallback_password

web_server:
  port: 80

uart:
  id: uart_0
  tx_pin: ${tx_pin}
  rx_pin: ${rx_pin}
  baud_rate: 9600
  data_bits: 8
  parity: NONE
  stop_bits: 1

modbus:
  id: modbus_0
  uart_id: uart_0
  send_wait_time: 250ms

modbus_controller:
  - id: sms_0
    address: 0x01
    modbus_id: modbus_0

    setup_priority: -10

    command_throttle: 50ms

    update_interval: 2s