text_sensor:

  - platform: template
    id: pv_total_tracking_status
    name: "PV Total Tracking Status"
    lambda: |-
      switch ((uint16_t)id(pv_total_tracking_status_raw).state) {
        case 0: return {"Idle"};
        case 1: return {"MPPT"};
        default: return {"Unknown"};
      }

  - platform: template
    id: pv_total_recharge_state
    name: "PV Total Recharge State"
    lambda: |-
      switch ((uint16_t)id(pv_total_recharge_state_raw).state) {
        case 0: return {"Disabled"};
        case 1: return {"Charging"};
        default: return {"Unknown"};
      }

  - platform: template
    id: pv1_tracking_status
    name: "PV1 Tracking Status"
    lambda: |-
      switch ((uint16_t)id(pv1_tracking_status_raw).state) {
        case 0: return {"Idle"};
        case 1: return {"MPPT"};
        default: return {"Unknown"};
