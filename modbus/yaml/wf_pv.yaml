    name: "PV1 Recharge State"
    lambda: |-
      switch ((uint16_t)id(pv1_recharge_state_raw).state) {
        case 0: return {"Disabled"};
        case 1: return {"Charging"};
        default: return {"Unknown"};
      }

  - platform: template
    id: pv2_tracking_status
    name: "PV2 Tracking Status"
    lambda: |-
      switch ((uint16_t)id(pv2_tracking_status_raw).state) {
        case 0: return {"Idle"};
        case 1: return {"MPPT"};
        default: return {"Unknown"};
