sensor:

###############################################################################
# Status / Faults / Alarms
###############################################################################

  - platform: modbus_controller
    modbus_controller_id: sms_0
    id: software_version
    name: "Software Version"
    address: 0x0040
    register_type: holding
    value_type: U_WORD
    entity_category: diagnostic

  - platform: modbus_controller
    modbus_controller_id: sms_0
    id: bms_connection_status
    name: "BMS Connection Status"
    address: 0x0041
    register_type: holding
    value_type: U_WORD
    entity_category: diagnostic

  - platform: modbus_controller
    modbus_controller_id: sms_0
    id: state_machine_state
    name: "State Machine State"
    address: 0x0042
    register_type: holding
    value_type: U_WORD

  - platform: modbus_controller
    modbus_controller_id: sms_0
    id: energy_terminal_status
    name: "Energy Terminal Status"
    address: 0x0043
    register_type: holding
    value_type: U_WORD

  - platform: modbus_controller
    modbus_controller_id: sms_0
    id: energy_flow_state
    name: "Energy Flow State"
    address: 0x0044
    register_type: holding
    value_type: U_WORD

  - platform: modbus_controller
    modbus_controller_id: sms_0
    id: parallel_operation
    name: "Parallel Operation"
    address: 0x0045
    register_type: holding
    value_type: U_WORD

  - platform: modbus_controller
    modbus_controller_id: sms_0
    id: fault_code_1
    name: "Fault Code 1"
    address: 0x0046
    register_type: holding
    value_type: U_WORD
    entity_category: diagnostic

  - platform: modbus_controller
    modbus_controller_id: sms_0
    id: fault_code_2
    name: "Fault Code 2"
    address: 0x0047
    register_type: holding
    value_type: U_WORD
    entity_category: diagnostic

  - platform: modbus_controller
    modbus_controller_id: sms_0
    id: alarm_code_1
    name: "Alarm Code 1"
    address: 0x0048
    register_type: holding
    value_type: U_WORD
    entity_category: diagnostic

  - platform: modbus_controller
    modbus_controller_id: sms_0
    id: alarm_code_2
    name: "Alarm Code 2"
    address: 0x0049
    register_type: holding
    value_type: U_WORD
    entity_category: diagnostic

