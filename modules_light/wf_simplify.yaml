###############################################################################
# Fault / Alarm Binary Sensors
###############################################################################

binary_sensor:

#
# Fault Code 1 (0x0046)
#

  - platform: template
    name: "Mains Soft Start Failure"
    device_class: problem
    lambda: 'return ((uint16_t)id(fault_code_1).state & (1 << 0));'

  - platform: template
    name: "Bus Overvoltage"
    device_class: problem
    lambda: 'return ((uint16_t)id(fault_code_1).state & (1 << 1));'

  - platform: template
    name: "Bus Undervoltage"
    device_class: problem
    lambda: 'return ((uint16_t)id(fault_code_1).state & (1 << 2));'

