    name: "Phase A Load Active Power"
    address: 0x005B
    register_type: holding
    value_type: S_WORD
    unit_of_measurement: "W"
    device_class: power
    state_class: measurement

  - platform: modbus_controller
    modbus_controller_id: sms_0
    id: phase_a_load_apparent_power
    name: "Phase A Load Apparent Power"
    address: 0x005C
    register_type: holding
    value_type: S_WORD
    unit_of_measurement: "VA"
    device_class: apparent_power
    state_class: measurement

 


