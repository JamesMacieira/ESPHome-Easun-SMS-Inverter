sensor:

###############################################################################
# Status / Faults / Alarms
###############################################################################

  - platform: modbus_controller
    modbus_controller_id: sms_0
    id: software_version
    name: "Software Version"
    address: 0x0040
    register_type: holding
    value_type: U_WORD
    entity_category: diagnostic


  - platform: modbus_controller
    modbus_controller_id: sms_0
    id: fault_code_1
    name: "Fault Code 1"
    address: 0x0046
    register_type: holding
    value_type: U_WORD
    entity_category: diagnostic

  - platform: modbus_controller
    modbus_controller_id: sms_0
    id: fault_code_2
    name: "Fault Code 2"
    address: 0x0047
    register_type: holding
    value_type: U_WORD
    entity_category: diagnostic

  - platform: modbus_controller
    modbus_controller_id: sms_0
    id: alarm_code_1
    name: "Alarm Code 1"
    address: 0x0048
    register_type: holding
    value_type: U_WORD
    entity_category: diagnostic

  - platform: modbus_controller
    modbus_controller_id: sms_0
    id: alarm_code_2
    name: "Alarm Code 2"
    address: 0x0049
    register_type: holding
    value_type: U_WORD
    entity_category: diagnostic

###############################################################################
# Phase A
###############################################################################

  - platform: modbus_controller
    modbus_controller_id: sms_0
    id: phase_a_grid_voltage
    name: "Phase A Grid Voltage"
    address: 0x0050
    register_type: holding
    value_type: S_WORD
    unit_of_measurement: "V"
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 1
    filters:
      - multiply: 0.1

  - platform: modbus_controller
    modbus_controller_id: sms_0
    id: phase_a_grid_current
    name: "Phase A Grid Current"
    address: 0x0051
    register_type: holding
    value_type: S_WORD
    unit_of_measurement: "A"
    device_class: current
    state_class: measurement
    accuracy_decimals: 2
    filters:
      - multiply: 0.01

  - platform: modbus_controller
    modbus_controller_id: sms_0
    id: phase_a_grid_frequency
    name: "Phase A Grid Frequency"
    address: 0x0052
    register_type: holding
    value_type: S_WORD
    unit_of_measurement: "Hz"
    device_class: frequency
    state_class: measurement
    accuracy_decimals: 2
    filters:
      - multiply: 0.01

  - platform: modbus_controller
    modbus_controller_id: sms_0
    id: phase_a_grid_power
    name: "Phase A Grid Power"
    address: 0x0053
    register_type: holding
    value_type: S_WORD
    unit_of_measurement: "W"
    device_class: power
    state_class: measurement

  - platform: modbus_controller
    modbus_controller_id: sms_0
    id: phase_a_load_voltage
    name: "Phase A Load Voltage"
    address: 0x0058
    register_type: holding
    value_type: S_WORD
    unit_of_measurement: "V"
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 1
    filters:
      - multiply: 0.1

  - platform: modbus_controller
    modbus_controller_id: sms_0
    id: phase_a_load_current
    name: "Phase A Load Current"
    address: 0x0059
    register_type: holding
    value_type: S_WORD
    unit_of_measurement: "A"
    device_class: current
    state_class: measurement
    accuracy_decimals: 2
    filters:
      - multiply: 0.01

  - platform: modbus_controller
    modbus_controller_id: sms_0
    id: phase_a_load_frequency
    name: "Phase A Load Frequency"
    address: 0x005A
    register_type: holding
    value_type: S_WORD
    unit_of_measurement: "Hz"
    device_class: frequency
    state_class: measurement
    accuracy_decimals: 2
    filters:
      - multiply: 0.01

  - platform: modbus_controller
    modbus_controller_id: sms_0
    id: phase_a_load_active_power
    name: "Phase A Load Active Power"
    address: 0x005B
    register_type: holding
    value_type: S_WORD
    unit_of_measurement: "W"
    device_class: power
    state_class: measurement

  - platform: modbus_controller
    modbus_controller_id: sms_0
    id: phase_a_load_apparent_power
    name: "Phase A Load Apparent Power"
    address: 0x005C
    register_type: holding
    value_type: S_WORD
    unit_of_measurement: "VA"
    device_class: apparent_power
    state_class: measurement

 