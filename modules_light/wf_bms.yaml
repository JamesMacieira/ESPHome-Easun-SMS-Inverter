###############################################################################
# WF_BMS
###############################################################################

sensor:

#
# Battery Measurements
#

  - platform: modbus_controller
    modbus_controller_id: sms_0
    id: bms_voltage
    name: "BMS Voltage"
    address: 0x0193
    register_type: holding
    value_type: S_WORD
    unit_of_measurement: "V"
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 1
    filters:
      - multiply: 0.1

  - platform: modbus_controller
    modbus_controller_id: sms_0
    id: bms_current
    name: "BMS Current"
    address: 0x0194
    register_type: holding
    value_type: S_WORD
    unit_of_measurement: "A"
    device_class: current
    state_class: measurement
    accuracy_decimals: 1
    filters:
      - multiply: 0.1

  - platform: modbus_controller
    modbus_controller_id: sms_0
    id: bms_temperature
    name: "BMS Temperature"
    address: 0x0195
    register_type: holding
    value_type: S_WORD
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    filters:
      - multiply: 0.1

  - platform: modbus_controller
    modbus_controller_id: sms_0
    id: bms_soc
    name: "BMS SOC"
    address: 0x0196
    register_type: holding
    value_type: S_WORD
    unit_of_measurement: "%"
    device_class: battery
    state_class: measurement

  - platform: modbus_controller
    modbus_controller_id: sms_0
    id: bms_soh
    name: "BMS SOH"
    address: 0x0197
    register_type: holding
    value_type: S_WORD
    unit_of_measurement: "%"
    state_class: measurement

#
# Capacity
#

  - platform: modbus_controller
    modbus_controller_id: sms_0
    id: bms_current_capacity
    name: "BMS Current Capacity"
    address: 0x0198
    register_type: holding
    value_type: U_WORD
    unit_of_measurement: "Ah"
    

  - platform: modbus_controller
    modbus_controller_id: sms_0
    id: bms_full_charge_capacity
    name: "BMS Full Charge Capacity"
    address: 0x0199
    register_type: holding
    value_type: U_WORD
    unit_of_measurement: "Ah"
    