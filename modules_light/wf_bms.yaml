###############################################################################
# WF_BMS
###############################################################################

text_sensor:

  - platform: template
    id: bms_communication_status
    name: "BMS Communication Status"
    lambda: |-
      switch ((uint16_t)id(bms_communication_status_raw).state) {
        case 0: return {"ID Search"};
        case 1: return {"ID Remote Lock"};
        case 2: return {"ID Locked"};
        default: return {"Unknown"};
      }

sensor:

#
# RAW
#

  - platform: modbus_controller
    modbus_controller_id: sms_0
    id: bms_communication_status_raw
    internal: true
    address: 0x0191
    register_type: holding
    value_type: U_WORD



#
# Battery Measurements
#

  - platform: modbus_controller
    modbus_controller_id: sms_0
    id: bms_voltage
    name: "BMS Voltage"
    address: 0x0193
    register_type: holding
    value_type: S_WORD
    unit_of_measurement: "V"
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 1
    filters:
      - multiply: 0.1

  - platform: modbus_controller
    modbus_controller_id: sms_0
    id: bms_current
    name: "BMS Current"
    address: 0x0194
    register_type: holding
    value_type: S_WORD
    unit_of_measurement: "A"
    device_class: current
    state_class: measurement
    accuracy_decimals: 1
    filters:
      - multiply: 0.1

  - platform: modbus_controller
    modbus_controller_id: sms_0
    id: bms_temperature
    name: "BMS Temperature"
    address: 0x0195
    register_type: holding
    value_type: S_WORD
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    filters:
      - multiply: 0.1

  - platform: modbus_controller
    modbus_controller_id: sms_0
    id: bms_soc
    name: "BMS SOC"
    address: 0x0196
    register_type: holding
    value_type: S_WORD
    unit_of_measurement: "%"
    device_class: battery
    state_class: measurement

  - platform: modbus_controller
    modbus_controller_id: sms_0
    id: bms_soh
    name: "BMS SOH"
    address: 0x0197
    register_type: holding
    value_type: S_WORD
    unit_of_measurement: "%"
    state_class: measurement

#
# Capacity
#

  - platform: modbus_controller
    modbus_controller_id: sms_0
    id: bms_current_capacity
    name: "BMS Current Capacity"
    address: 0x0198
    register_type: holding
    value_type: U_WORD
    unit_of_measurement: "mAh"
    filters:
      - multiply: 10

  - platform: modbus_controller
    modbus_controller_id: sms_0
    id: bms_full_charge_capacity
    name: "BMS Full Charge Capacity"
    address: 0x0199
    register_type: holding
    value_type: U_WORD
    unit_of_measurement: "mAh"
    filters:
      - multiply: 10


#
# Protection Thresholds
#

  - platform: modbus_controller
    modbus_controller_id: sms_0
    id: bms_low_soc_alarm
    name: "BMS Low SOC Alarm"
    address: 0x019D
    register_type: holding
    value_type: S_WORD
    unit_of_measurement: "%"

  - platform: modbus_controller
    modbus_controller_id: sms_0
    id: bms_low_soc_shutdown
    name: "BMS Low SOC Shutdown"
    address: 0x019E
    register_type: holding
    value_type: S_WORD
    unit_of_measurement: "%"

#
# Diagnostic Registers
#

  - platform: modbus_controller
    modbus_controller_id: sms_0
    id: bms_alarm_register
    name: "BMS Alarm Register"
    address: 0x01A1
    register_type: holding
    value_type: U_WORD
    entity_category: diagnostic

  - platform: modbus_controller
    modbus_controller_id: sms_0
    id: bms_fault_register
    name: "BMS Fault Register"
    address: 0x01A2
    register_type: holding
    value_type: U_WORD
    entity_category: diagnostic