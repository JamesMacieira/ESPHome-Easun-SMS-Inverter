sensor:

  - platform: modbus_controller
    modbus_controller_id: sms_0
    id: ${name}_pv_voltage
    name: "${name} PV Voltage"
    address: 0x0260
    register_type: holding
    value_type: S_WORD
    unit_of_measurement: V
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 1
    filters:
      - multiply: 0.1

  - platform: modbus_controller
    modbus_controller_id: sms_0
    id: ${name}_pv_current
    name: "${name} PV Current"
    address: 0x0261
    register_count: 2
    register_type: holding
    value_type: U_DWORD
    unit_of_measurement: A
    device_class: current
    state_class: measurement
    accuracy_decimals: 2
    filters:
      - multiply: 0.01

  - platform: modbus_controller
    modbus_controller_id: sms_0
    id: ${name}_pv_power
    name: "${name} PV Power"
    address: 0x0263
    register_count: 2
    register_type: holding
    value_type: U_DWORD
    unit_of_measurement: W
    device_class: power
    state_class: measurement

