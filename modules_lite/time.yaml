# Inverter clock synchronization. The CVTE protocol requires each setting to
# be written separately, with more than 500 ms between settings.

globals:
  - id: inverter_clock_synced_this_boot
    type: bool
    restore_value: no
    initial_value: 'false'

script:
  - id: synchronize_inverter_clock
    mode: single
    then:
      - lambda: |-
          auto now = id(inverter_ntp_time).now();
          if (!now.is_valid()) {
            ESP_LOGW("easun_sms", "Inverter clock not synchronized: NTP time is invalid");
            return;
          }

          id(inverter_clock_synced_this_boot) = true;
          auto *controller = id(sms_0);
          // The normal Lite throttle is 150 ms. Raise it temporarily so the
          // six separate UserSet writes comply with the protocol's >500 ms rule.
          controller->set_command_throttle(600);

          const std::vector<std::pair<uint16_t, uint16_t>> clock_values = {
              {0x4139, static_cast<uint16_t>(now.year % 100)},
              {0x4138, static_cast<uint16_t>(now.month)},
              {0x4137, static_cast<uint16_t>(now.day_of_month)},
              {0x4136, static_cast<uint16_t>(now.hour)},
              {0x4135, static_cast<uint16_t>(now.minute)},
              {0x4134, static_cast<uint16_t>(now.second)},
          };

          for (size_t index = 0; index < clock_values.size(); index++) {
            const auto &setting = clock_values[index];
            auto command = esphome::modbus_controller::ModbusCommandItem::create_write_multiple_command(
                controller, setting.first, 1, std::vector<uint16_t>{setting.second});

            if (index == clock_values.size() - 1) {
              command.on_data_func = [controller](auto type, uint16_t address, const auto &data) {
                controller->on_write_register_response(type, address, data);
                controller->set_command_throttle(150);
                ESP_LOGI("easun_sms", "Inverter clock synchronized");
              };
            }
            controller->queue_command(command);
          }

time:
  - platform: sntp
    id: inverter_ntp_time
    timezone: Europe/Lisbon
    on_time_sync:
      then:
        - if:
            condition:
              lambda: 'return !id(inverter_clock_synced_this_boot);'
            then:
              - script.execute: synchronize_inverter_clock
    on_time:
      - seconds: 0
        minutes: 5
        hours: 3
        then:
          - script.execute: synchronize_inverter_clock

button:
  - platform: template
    name: "Synchronize Inverter Clock"
    icon: mdi:clock-sync
    entity_category: config
    on_press:
      - script.execute: synchronize_inverter_clock
