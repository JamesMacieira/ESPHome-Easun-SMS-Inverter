# Inverter clock synchronization. The CVTE protocol requires each setting to
# be written separately, with more than 500 ms between settings.

globals:
  - id: inverter_clock_synced_this_boot
    type: bool
    restore_value: no
    initial_value: 'false'

text_sensor:
  - platform: template
    id: inverter_clock
    name: "Inverter Date and Time"
    icon: mdi:clock-outline
    entity_category: diagnostic

script:
  - id: read_inverter_clock
    mode: single
    then:
      - lambda: |-
          auto *controller = id(sms_0);
          auto readback = esphome::modbus_controller::ModbusCommandItem::create_read_command(
              controller, esphome::modbus_controller::ModbusRegisterType::HOLDING, 0x4134, 6,
              [](auto, uint16_t address, const auto &response) {
                if (response.size() < 12) {
                  ESP_LOGE("easun_sms", "Inverter clock readback is incomplete at register 0x%04X", address);
                  return;
                }

                const uint16_t second = (uint16_t(response[0]) << 8) | response[1];
                const uint16_t minute = (uint16_t(response[2]) << 8) | response[3];
                const uint16_t hour = (uint16_t(response[4]) << 8) | response[5];
                const uint16_t day = (uint16_t(response[6]) << 8) | response[7];
                const uint16_t month = (uint16_t(response[8]) << 8) | response[9];
                const uint16_t year = (uint16_t(response[10]) << 8) | response[11];
                if (second > 59 || minute > 59 || hour > 23 || day == 0 || day > 31 || month == 0 || month > 12 || year > 99) {
                  ESP_LOGE("easun_sms", "Invalid inverter clock readback: %u-%u-%u %u:%u:%u", year, month, day, hour, minute, second);
                  return;
                }

                char timestamp[20];
                snprintf(timestamp, sizeof(timestamp), "%04u-%02u-%02u %02u:%02u:%02u", year + 2000, month, day, hour, minute, second);
                id(inverter_clock).publish_state(timestamp);
                ESP_LOGI("easun_sms", "Inverter clock readback: %s", timestamp);
              });
          controller->queue_command(readback);

  - id: synchronize_inverter_clock
    mode: single
    then:
      - lambda: |-
          auto now = id(inverter_ntp_time).now();
          if (!now.is_valid()) {
            ESP_LOGW("easun_sms", "Inverter clock not synchronized: NTP time is invalid");
            return;
          }

          id(inverter_clock_synced_this_boot) = true;
          auto *controller = id(sms_0);
          // The normal Lite throttle is 150 ms. Raise it temporarily so the
          // six separate UserSet writes comply with the protocol's >500 ms rule.
          controller->set_command_throttle(600);

          const std::vector<std::pair<uint16_t, uint16_t>> clock_values = {
              {0x4139, static_cast<uint16_t>(now.year % 100)},
              {0x4138, static_cast<uint16_t>(now.month)},
              {0x4137, static_cast<uint16_t>(now.day_of_month)},
              {0x4136, static_cast<uint16_t>(now.hour)},
              {0x4135, static_cast<uint16_t>(now.minute)},
              {0x4134, static_cast<uint16_t>(now.second)},
          };

          for (size_t index = 0; index < clock_values.size(); index++) {
            const auto &setting = clock_values[index];
            auto command = esphome::modbus_controller::ModbusCommandItem::create_write_multiple_command(
                controller, setting.first, 1, std::vector<uint16_t>{setting.second});

            if (index == clock_values.size() - 1) {
              command.on_data_func = [controller](auto type, uint16_t address, const auto &data) {
                controller->on_write_register_response(type, address, data);
                controller->set_command_throttle(150);
                ESP_LOGI("easun_sms", "Inverter clock synchronized");
                id(read_inverter_clock).execute();
              };
            }
            controller->queue_command(command);
          }

interval:
  - interval: 5min
    then:
      - script.execute: read_inverter_clock

time:
  - platform: sntp
    id: inverter_ntp_time
    timezone: Europe/Lisbon
    on_time_sync:
      then:
        - if:
            condition:
              lambda: 'return !id(inverter_clock_synced_this_boot);'
            then:
              - script.execute: synchronize_inverter_clock
    on_time:
      - seconds: 0
        minutes: 5
        hours: 3
        then:
          - script.execute: synchronize_inverter_clock

button:
  - platform: template
    name: "Synchronize Inverter Clock"
    icon: mdi:clock-sync
    entity_category: config
    on_press:
      - script.execute: synchronize_inverter_clock
