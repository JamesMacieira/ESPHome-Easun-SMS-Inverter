###########
# Battery #
###########

sensor:

  - platform: modbus_controller
    modbus_controller_id: sms_0
    id: battery_percentage
    name: "Battery Percentage"
    skip_updates: 5
    address: 0x0152
    register_type: holding
    value_type: S_WORD
    unit_of_measurement: "%"
    device_class: battery
    state_class: measurement

  - platform: modbus_controller
    modbus_controller_id: sms_0
    id: bus_voltage
    name: "Bus Voltage"
    skip_updates: 5
    address: 0x0154
    register_type: holding
    value_type: S_WORD
    unit_of_measurement: V
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 1
    filters:
      - multiply: 0.1

  - platform: modbus_controller
    modbus_controller_id: sms_0
    id: battery_voltage
    name: "Battery Voltage"
    skip_updates: 5
    address: 0x0155
    register_type: holding
    value_type: S_WORD
    unit_of_measurement: V
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 1
    filters:
      - multiply: 0.1

  - platform: modbus_controller
    modbus_controller_id: sms_0
    id: battery_discharge_current
    name: "Battery Discharge Current"
    address: 0x0156
    register_type: holding
    value_type: S_WORD
    unit_of_measurement: A
    device_class: current
    state_class: measurement
    accuracy_decimals: 1
    filters:
      - lambda: |-
          return x < 0.0f ? -x : 0.0f;
      - multiply: 0.1

  - platform: modbus_controller
    modbus_controller_id: sms_0
    id: battery_charge_current
    name: "Battery Charge Current"
    address: 0x0157
    register_type: holding
    value_type: S_WORD
    unit_of_measurement: A
    device_class: current
    state_class: measurement
    accuracy_decimals: 1
    filters:
      - lambda: |-
          return x > 0.0f ? x : 0.0f;
      - multiply: 0.1

  - platform: modbus_controller
    modbus_controller_id: sms_0
    id: battery_current
    name: "Battery Current"
    address: 0x0194
    register_type: holding
    value_type: S_WORD
    unit_of_measurement: "A"
    device_class: current
    state_class: measurement
    accuracy_decimals: 1
    filters:
      - multiply: 0.1

  - platform: modbus_controller
    modbus_controller_id: sms_0
    id: bms_temperature
    name: "BMS Temperature"
    skip_updates: 5
    address: 0x0195
    register_type: holding
    value_type: S_WORD
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    filters:
      - multiply: 0.1

  - platform: modbus_controller
    modbus_controller_id: sms_0
    id: battery_soh
    name: "Battery SOH"
    skip_updates: 5
    address: 0x0197
    register_type: holding
    value_type: S_WORD
    unit_of_measurement: "%"
    state_class: measurement

  - platform: modbus_controller
    modbus_controller_id: sms_0
    id: battery_capacity
    name: "Battery Capacity"
    skip_updates: 5
    address: 0x0198
    register_type: holding
    value_type: U_WORD
    unit_of_measurement: "Ah"