sensor:

###############################################################################
# Inverter Mains and Load Measurements
###############################################################################

  - platform: modbus_controller
    modbus_controller_id: sms_0
    id: mains_energy_daily
    name: "Mains Energy Daily"
    address: 0x02AE
    register_count: 2
    register_type: holding
    value_type: U_DWORD
    unit_of_measurement: kWh
    device_class: energy
    state_class: total_increasing
    filters:
      - multiply: 0.01

  - platform: modbus_controller
    modbus_controller_id: sms_0
    id: mains_energy_monthly
    name: "Mains Energy Monthly"
    address: 0x02B0
    register_count: 2
    register_type: holding
    value_type: U_DWORD
    unit_of_measurement: kWh
    device_class: energy
    state_class: total_increasing
    filters:
      - multiply: 0.01

  - platform: modbus_controller
    modbus_controller_id: sms_0
    id: mains_energy_total
    name: "Mains Energy Total"
    address: 0x02B2
    register_count: 2
    register_type: holding
    value_type: U_DWORD
    unit_of_measurement: kWh
    device_class: energy
    state_class: total_increasing
    filters:
      - multiply: 0.01

  - platform: modbus_controller
    modbus_controller_id: sms_0
