      - multiply: 0.01

  - platform: modbus_controller
    modbus_controller_id: sms_0
    id: load_energy_monthly
    name: "Load Energy Monthly"
    address: 0x02B6
    register_count: 2
    register_type: holding
    value_type: U_DWORD
    unit_of_measurement: kWh
    device_class: energy
    state_class: total_increasing
    filters:
      - multiply: 0.01

  - platform: modbus_controller
    modbus_controller_id: sms_0
    id: load_energy_total
    name: "Load Energy Total"
    address: 0x02B8
    register_count: 2
    register_type: holding
    value_type: U_DWORD
    unit_of_measurement: kWh
    device_class: energy
    state_class: total_increasing
    filters:
      - multiply: 0.01

###############################################################################
# Inverter PV Measurements
###############################################################################

  - platform: modbus_controller
    modbus_controller_id: sms_0
    id: pv_energy_today
    name: "PV Energy Today"
    address: 0x009C
    register_type: holding
    value_type: U_WORD
    unit_of_measurement: "KWh"
    filters:
      - multiply: 0.01

  - platform: modbus_controller
    modbus_controller_id: sms_0
    id: pv_daily_energy
    name: "PV Daily Energy"
    address: 0x0267
    register_count: 2
    register_type: holding
    value_type: U_DWORD
    unit_of_measurement: kWh
    device_class: energy
    state_class: total_increasing
    accuracy_decimals: 2
    filters:
      - multiply: 0.01

  - platform: modbus_controller
    modbus_controller_id: sms_0
    id: pv_monthly_energy
    name: "PV Monthly Energy"
    address: 0x0269
    register_count: 2
