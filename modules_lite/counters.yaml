    skip_updates: 10
    name: "${name} PV Energy Today"
    address: 0x009C
    register_type: holding
    value_type: U_WORD
    unit_of_measurement: "KWh"
    filters:
      - multiply: 0.01

  - platform: modbus_controller
    modbus_controller_id: sms_0
    id: ${name}_pv_daily_energy
