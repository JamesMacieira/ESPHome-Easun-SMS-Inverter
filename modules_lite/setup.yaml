select:
 
  - platform: modbus_controller
    modbus_controller_id: sms_0
    name: "Output Priority Setting"
    address: 0x4102
    skip_updates: 19
    value_type: U_WORD
    use_write_multiple: true
    optionsmap:
      "Grid > PV > Battery (GPB)": 0
      "PV > Grid > Battery (PGB)": 1
      "PV > Battery > Grid (PBG)": 2
      "MKS": 3
    entity_category: config

  - platform: modbus_controller
    modbus_controller_id: sms_0
    name: "Charging Priority Setting"
    address: 0x4104
    skip_updates: 19
    value_type: U_WORD
    use_write_multiple: true
    optionsmap:
      "PV and Grid (PNG)": 0
      "Only PV (OPV)": 1
      "PV First (PVF)": 2
    entity_category: config

  - platform: modbus_controller
    modbus_controller_id: sms_0
    name: "Maximum Charging Current Setting"
    address: 0x4106
    skip_updates: 19
    value_type: U_WORD
    use_write_multiple: true
    optionsmap:
      "2 A": 0
      "10 A": 1
      "20 A": 2
      "30 A": 3
      "40 A": 4
      "50 A": 5
      "60 A": 6
      "70 A": 7
      "80 A": 8
      "90 A": 9
      "100 A": 10
      "110 A": 11
      "120 A": 12
    entity_category: config


number:

  - platform: modbus_controller
    modbus_controller_id: sms_0
    name: "AC Charging Current Setting"
    address: 0x4105
    skip_updates: 19
    value_type: U_WORD
    use_write_multiple: true
    min_value: 2
    max_value: 120
    step: 1
    unit_of_measurement: A
    entity_category: config

  - platform: modbus_controller
    modbus_controller_id: sms_0
    name: "Battery Low Voltage Alarm Setting"
    address: 0x4108
    skip_updates: 19
    value_type: U_WORD
    use_write_multiple: true
    lambda: return x * 0.1f;
    write_lambda: |-
      payload.push_back((uint16_t) lroundf(x * 10.0f));
      return x;
    min_value: 42
    max_value: 54
    step: 0.1
    unit_of_measurement: V
    entity_category: config

  - platform: modbus_controller
