select:
 
  - platform: modbus_controller
    modbus_controller_id: sms_0
    name: "${name} Output Priority Setting"
    address: 0x4102
    skip_updates: 19
    value_type: U_WORD
    use_write_multiple: true
    optionsmap:
      "Grid > PV > Battery (GPB)": 0
      "PV > Grid > Battery (PGB)": 1
      "PV > Battery > Grid (PBG)": 2
      "MKS": 3
    write_lambda: |-
      const uint16_t requested = static_cast<uint16_t>(value);
      const auto requested_state = x;
      auto *controller = id(sms_0);
      auto command = esphome::modbus_controller::ModbusCommandItem::create_write_multiple_command(
          controller, 0x4102, 1, std::vector<uint16_t>{requested});
      command.on_data_func = [controller, item, requested, requested_state](auto type, uint16_t address, const auto &data) {
        controller->on_write_register_response(type, address, data);
        auto readback = esphome::modbus_controller::ModbusCommandItem::create_read_command(
            controller, esphome::modbus_controller::ModbusRegisterType::HOLDING, address, 1,
            [item, requested, requested_state](auto, uint16_t read_address, const auto &response) {
              if (response.size() >= 2 && ((uint16_t(response[0]) << 8 | response[1]) == requested)) {
                item->publish_state(requested_state);
                ESP_LOGI("easun_sms", "Write confirmed by inverter for register 0x%04X", read_address);
              } else {
                ESP_LOGE("easun_sms", "Readback mismatch for register 0x%04X", read_address);
              }
            });
        controller->queue_command(readback);
      };
      controller->queue_command(command);
      return {};
    entity_category: config

